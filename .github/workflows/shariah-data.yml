name: Update Shariah ratios

# Recomputes the financial screens from SEC filings every night,
# and can be run by hand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, after US filings settle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shariah-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Anthropic SDK (used only when ANTHROPIC_API_KEY is set)
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk@1.3.0 zod@4.6.7

      - name: Build data/shariah-ratios.json
        env:
          # Repository secrets (Settings > Secrets and variables > Actions); all but SEC_USER_AGENT are optional
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-shariah-data.mjs

      - name: Commit if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Shariah ratios from SEC filings"
          git push
